syntax = "proto3";

import "cif_common.proto";
import "cif_plugin_core.proto";
import "cif_channel_core.proto";

package cif.manager;

service Manager {
  // Load a specific plugin instance.
  rpc LoadPlugin (PluginConfig) returns (cif.common.Status) {}
  // Plugin calls this to register itself with the manager.
  rpc RegisterPlugin (RegisterData) returns (cif.common.Empty) {}
  // Plugin calls this to unregister itself with the manager.
  rpc UnregisterPlugin (UnregisterData) returns (cif.common.Empty) {}
  // Gets the names of all Plugin Types on the system.
  rpc QueryPluginTypes (QueryTypeSettings) returns (PluginTypeReply) {}
   // Aborts a plugin.  This should only be used if a plug-in is not responding to normal commands.
  rpc AbortPlugin (PluginName) returns (cif.common.Status) {}
  // Unload all the instantiated plugins. If the plugins are running it will attempt to stop them.
  rpc UnloadAllPlugins (cif.common.Empty) returns (cif.common.Status) {}
  // Destroy the manager.  If plugins are running it will attempt to stop them.  
  rpc Destroy (cif.common.Empty) returns (cif.common.Empty) {}
  // Ping the manager.  
  rpc Ping (cif.common.Empty) returns (cif.common.Status) {}
  // Query the errors occurred.
  rpc QueryErrors (QuerySettings) returns (ErrorInfoList) {}
  // Query the errors occurred.
  rpc QueryConfig (QuerySettings) returns (FileData) {}
  // Query the errors occurred.
  rpc QueryInfo (QuerySettings) returns (FileData) {}
  // Reset the filter time for returned errors. 
  rpc ResetErrorIndex (cif.common.Empty) returns (cif.common.Status) {}
  // Reset the filter time for returned configuration. 
  rpc ResetConfigIndex (cif.common.Empty) returns (cif.common.Status) {}
  // Reset the filter time for returned information. 
  rpc ResetInfoIndex (cif.common.Empty) returns (cif.common.Status) {}
  // Gets the name, type, status, and gRPC port of all loaded plugins.
  rpc QueryPluginInfo (cif.common.Empty) returns (PluginInfoArray) {}
  // Gets the name, type, status, and gRPC port of loaded plugin by name.
  rpc QueryPlugin (PluginName) returns (PluginInfoResponse) {}
  // Provides the plugin status and requests system status.
  rpc QuerySystemStatus (PluginStatus) returns (SystemStatus) {}
  // Updates a tracked clock with a new timestamp pair or a reset.
  rpc UpdateClock (ClockUpdate) returns (cif.common.Status) {}
  // Create orchestration file from logged configuration.
  rpc CreateOrch (OrchConfig) returns (OrchReturn) {}
  // Query the errors occurred.
  rpc QueryClockStatus (cif.common.Empty) returns (ClockStatusArray) {}
  // Query all channels on the system matching the filter.  Filter parameters are AND to pass.  
  rpc QueryAllChannels (cif.channelcore.ChannelFilter) returns (cif.channelcore.Channels) {}
}

message PluginConfig {
  string plugin_type = 1; //Name of the plugin type
  string plugin_name = 2; //Assigned name for the plugin instance.  Must be unique in the system.  
  string version = 3; //Optional string for version.  Format should be x.x.x (major, minor, fix).  Any missing entries will default to latest available on target.  For example 1.2 would default to the latest fix on the target of major 1, minor 2.
}

message	RegisterData {
  string plugin_name = 1;
  int32 grpc_port = 2;
  cif.common.ShortVersion plugin_version = 3;
}

message	UnregisterData {
  string plugin_name = 1;
  repeated string unregister_channels = 2;
}

message	PluginTypeReply {
  repeated PluginType plugin_types = 1;
}

message	PluginType {
  string plugin_type = 1;
  cif.common.ShortVersion plugin_version = 2;
  PluginMetadata plugin_metadata = 3;
}

message	PluginName {
  string plugin_name = 1;
}

message ErrorInfoList {
  repeated ErrorInfo error_info = 1;
}

message ErrorInfo {
  bool error_status = 1;
  int32 error_code = 2;
  string plugin = 3;
  string time = 4;
  string message = 5;
  string location = 6;
}

message QuerySettings {
  bool query_all = 1;
}

message QueryTypeSettings {
  bool reload = 1;
}

message FileData {
    string data = 1;
}

message PluginInfo {
  string plugin_name = 1;
  string plugin_type = 2;
  int32 grpc_port = 3;
  cif.common.ShortVersion plugin_version = 4;
  cif.plugincore.StatusData status = 5;
}

message PluginInfoResponse {
  PluginInfo plugin_info = 1;
  cif.common.Status status = 2;
}

message PluginInfoArray {
  repeated PluginInfo plugin_info = 1;
}

message PluginStatus {
  PluginName pluginname = 1;
  cif.plugincore.StatusData status = 2;
}

message TimePair {
  int64 system_time = 1;
  int64 external_time = 2;
}

message ClockConversion {
  uint32 clock_id = 1;
  int64 last_reset = 2;
  double slope = 3;
  TimePair offset_pair = 4; 
  string clock_name = 5;
}

message ClockConversionArray {
  repeated ClockConversion clock_conversions = 1;
}

message SystemStatus {
  ClockConversionArray clock_conversion_array = 1;
}

message ClockUpdate {
  uint32 clock_id = 1;
  TimePair timestamp_pair = 2; 
  bool reinit = 3;
  string clock_name = 4;
}

message ClockStatusArray {
  repeated ClockStatus clocks_status = 1;
}

message ClockStatus {
  ClockConversion clock_conversion = 1;
  int64 error_mean = 2;
  int64 error_std_dev = 3;
}

enum OrchestrationLanguage {
  NULL = 0;
  PYTHON = 1;
  }

message OrchConfig {
  uint64 start_timestamp = 1; // If non-zero will get all config and filter from this timestamp.  If zero will build since latest config reset
  bool create_file = 2; // Determine if file we be created on target
  OrchestrationLanguage orchestration_language = 3; // Only Python supported currently
  string filename = 4; // File name.  Should be format "name.py"
  string default_ip = 5; // If not empty will set as the IP address for the python script.  If empty will set as first IPv4 address from target
}

message OrchReturn {
  string orchestration_script = 1;
  cif.common.Status status = 2;
}

message PluginMetadata {
  string description = 1;
  string history = 2;
  string author = 3;
}
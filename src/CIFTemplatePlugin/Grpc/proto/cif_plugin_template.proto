syntax = "proto3";

package cif.templateplugin;

// This demonstrates a simple gRPC service.  This service will allow setting a numeric value in the plugin and reading that value back.  

service TemplatePlugin {
  rpc SetNumeric (Numeric) returns (Status) {}
  rpc GetNumeric (Empty) returns (Numeric) {}
}

message Numeric {
   int32 numeric = 1;
}

//The Status and Ermpty messages are useful for passing errors from the gRPC calls and for passing empty data in a call.  

message Status {
   int32 code = 1;
   string message = 2;
}

message Empty {}
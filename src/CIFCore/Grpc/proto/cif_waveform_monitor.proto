syntax = "proto3";

package cif.waveformmonitor;

service WaveformMonitor {
  rpc SetEnableWaveform (WaveformEnable) returns (Status) {}
  rpc GetWaveform (Empty) returns (Waveforms) {}
}

message Waveforms {
   repeated Waveform waveforms = 1;
   bool valid = 2;
}

message Waveform {
   repeated double y = 1;
   uint64 timestamp = 2;
   double dT = 3;
}

message WaveformEnable {
   bool enable_waveform = 1;
}

message Status {
   int32 code = 1;
   string message = 2;
}

message Empty {}